<g class="fade n2"><circle cx="520" cy="104" r="16" fill="none" stroke="#c7ff22" style="animation:ring 1.8s ease-out 2s infinite"/><circle cx="520" cy="104" r="10" fill="#c7ff22"/>
<text class="k" x="500" y="150" fill="#c7ff22" style="fill:#c7ff22">MASTER'S DEGREE · IN PROGRESS</text><text class="h" x="500" y="182">MSc Artificial Intelligence</text><text class="s" x="500" y="206">Nanjing University of Posts and Telecommunications</text></g>
