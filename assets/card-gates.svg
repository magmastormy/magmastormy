<g clip-path="url(#vis)"><defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#c7ff22" stroke-opacity="0.1"/></pattern><radialGradient id="glow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#c7ff22" stop-opacity=".28"/><stop offset="1" stop-color="#c7ff22" stop-opacity="0"/></radialGradient></defs><rect width="600" height="232" fill="#11130f"/><rect width="600" height="232" fill="url(#g)"/><rect width="600" height="232" fill="url(#glow)"/><circle cx="300" cy="118" r="92" fill="none" stroke="#c7ff22" stroke-opacity=".35" stroke-dasharray="4 7" style="transform-origin:300px 118px;animation:spin 40s linear infinite"/><svg x="220" y="30" width="160" height="160" viewBox="0 0 256 256" style="--mascot-glow-color:#C8F53A"><style>.mascot-gaze,.mascot-tilt,.mascot-visor,.mascot-float{transform-box:view-box}
