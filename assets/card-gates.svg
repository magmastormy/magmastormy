ity="0.04"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient><filter id="lift-bolt-idle" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"></feDropShadow></filter><clipPath id="clip-bolt-idle"><rect x="0" y="0" width="256" height="256"></rect></clipPath></defs><g class="mascot-float"><ellipse class="mascot-glow" cx="128" cy="148" rx="124" ry="104" fill="#C8F53A"></ellipse><ellipse cx="128" cy="238" rx="86" ry="20" fill="url(#ground-bolt-idle)"></ellipse><g clip-path="url(#clip-bolt-idle)" filter="url(#lift-bolt-idle)"><g class="mascot-tilt" style="transform-box:view-box;transform-origin:128px 104px"><rect x="52" y="120" width="152" height="132" rx="48" fill="url(#body-bolt-idle)" stroke="url(#rim-bolt-idle)" stroke-width="3"></rect><g><rect x="92" y="150" width="14" height="86" rx="7" fill="url(#bar-bolt-idle)"></rect><rect x="94.5" y="153" width="3" height="80" rx="1.5" fill="#FFFFFF" opacity="0.10"></rect></g><g><rect x="121" y="150" width="14" height="86" rx="7" fill="url(#bar-bolt-idle)"></rect><rect x="123.5" y="153" width="3" height="80" rx="1.5" fill="#FFFFFF" opacity="0.10"></rect></g><g><rect x="150" y="150" width="14" height="86" rx="7" fill="url(#bar-bolt-idle)"></rect><rect x="152.5" y="153" width="3" height="80" rx="1.5" fill="#FFFFFF" opacity="0.10"></rect></g><ellipse cx="128" cy="104" rx="84" ry="78" fill="url(#head-bolt-idle)" stroke="url(#rim-bolt-idle)" stroke-width="3"></ellipse><mask id="hmask-bolt-idle"><ellipse cx="128" cy="104" rx="81" ry="75" fill="#fff"></ellipse></mask><ellipse cx="128" cy="86" rx="70" ry="52" fill="url(#sheen-bolt-idle)" mask="url(#hmask-bolt-idle)"></ellipse><g><circle cx="64" cy="116" r="6.5" fill="url(#rivet-bolt-idle)" stroke="#0A0E15" stroke-width="1"></circle><circle cx="62.2" cy="114" r="1.8" fill="#FFFFFF" opacity="0.55"></circle></g><g><circle cx="192" cy="116" r="6.5" fill="url(#rivet-bolt-idle)